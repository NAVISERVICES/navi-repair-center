<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Navi Repair Center · Muy pronto</title>
<meta name="theme-color" content="#1A247D">
<link rel="icon" href="demo/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(circle at 50% 120%,#B4E32F33,transparent 55%),#1A247D;color:#fff;font-family:"DM Sans",system-ui,sans-serif;text-align:center}
main{max-width:540px}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px}
.brand img{height:52px;width:auto}
.brand small{font-size:12px;font-weight:700;letter-spacing:.2em;padding-left:12px;border-left:1px solid #ffffff66}
h1{font-family:"Sora",system-ui,sans-serif;font-weight:800;font-size:clamp(40px,9vw,68px);line-height:1;letter-spacing:-.02em;margin-bottom:16px}
h1 em{font-style:normal;color:#B4E32F}
p{color:#C9CCEA;font-size:17px;line-height:1.5}
.tool{font-size:44px;margin-bottom:16px;display:inline-block;animation:spin 4s ease-in-out infinite}
@keyframes spin{50%{transform:rotate(-18deg)}}
small.c{display:block;margin-top:32px;color:#C9CCEA;font-size:13px}
@media (prefers-reduced-motion:reduce){.tool{animation:none}}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="demo/assets/navi-logo.png" alt="Navi"><small>REPAIR CENTER</small></div>
  <span class="tool" aria-hidden="true">🔧</span>
  <h1>Muy <em>pronto</em></h1>
  <p>Estamos preparando el centro de servicio autorizado BOSE y De'Longhi.</p>
  <small class="c">© 2026 Navi Repair Center</small>
</main>
</body>
</html>
